openapi: 3.1.0
info:
  title: Preventive Pilot API
  version: 1.0.1
  description: |
    Version-controlled baseline for the REST API used by the web and mobile clients.
    The route inventory is complete as of the documentation audit on 2026-07-26.
    Detailed request/response reconciliation remains an active Phase 0 checklist item;
    until it is complete, handler Zod schemas and SQL behavior must also be reviewed.
x-contract-status: baseline-route-inventory
servers:
  - url: http://localhost:3001
    description: Local development
security:
  - bearerAuth: []
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Assets }
  - { name: Facilities }
  - { name: Templates }
  - { name: Scheduling }
  - { name: Tasks }
  - { name: WorkOrders }
  - { name: Reports }
  - { name: Notifications }
  - { name: AppUpdates }
  - { name: System }
  - { name: Dashboard }
  - { name: Devices }
