services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5056:5056"
    env_file:
      - ./.env
    environment:
      BACKEND_PORT: "5056"
      FRONTEND_ORIGIN: "http://localhost:9102"
    volumes:
      - ./.env:/app/.env:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    ports:
      - "9102:80"
    depends_on:
      - api

  ngrok-api:
    image: ngrok/ngrok:alpine
    command: start --all --config /etc/ngrok/ngrok.yml
    env_file:
      - ./.env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api
    volumes:
      - ./ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro
