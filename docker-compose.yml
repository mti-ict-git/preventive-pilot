services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5056:5056"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      BACKEND_PORT: "5056"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://pmit.merdekabattery.com,https://preventivepm.justanapi.my.id,http://localhost,http://localhost:9102,http://localhost:8081,capacitor://localhost}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-adminsdk.json
    volumes:
      - ./.env:/app/.env:ro
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-./firebase-adminsdk.json}:/app/firebase-adminsdk.json:ro
      - ${EVIDENCE_STORAGE_HOST_PATH:-./shared-documents}:/app/shared-documents

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    ports:
      - "9102:80"
    depends_on:
      - api
