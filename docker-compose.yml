services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5056:5056"
    restart: on-failure
    env_file:
      - ./.env
    environment:
      BACKEND_PORT: "5056"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:9102,http://localhost:8081,capacitor://localhost}
    volumes:
      - ./.env:/app/.env:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    ports:
      - "9102:80"
    depends_on:
      - api

  ngrok-api:
    image: ngrok/ngrok:alpine
    command: start --all --config /etc/ngrok/ngrok.yml
    env_file:
      - ./.env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - api
    volumes:
      - ./ngrok/ngrok.yml:/etc/ngrok/ngrok.yml:ro

  gist-watcher:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "scripts/ngrok/gist-watcher.mjs"]
    env_file:
      - ./.env
    environment:
      NGROK_API_URL: http://ngrok-api:4040/api/tunnels
      GITHUB_PAT: ${GITHUB_PAT}
      NGROK_GIST_ID: ${NGROK_GIST_ID}
      NGROK_GIST_FILE: ${NGROK_GIST_FILE:-ngrok.json}
      NGROK_POLL_INTERVAL_MS: ${NGROK_POLL_INTERVAL_MS:-5000}
    volumes:
      - ./:/app:ro
      - ./.env:/app/.env:ro
    depends_on:
      - ngrok-api
