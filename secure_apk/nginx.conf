limit_req_zone $binary_remote_addr zone=upload_rate:10m rate=5r/s;

server {
  listen 80;
  server_name _;

  root /;

  client_max_body_size 500m;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /apk/manifest.json {
    default_type application/json;
    add_header Cache-Control "private, max-age=0, no-store" always;
    try_files /mnt/share/manifest.json "/mnt/share/Apps Standard/Android/Release/apk/manifest.json" =404;
  }

  location /api/ {
    limit_req zone=upload_rate burst=10 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://uploader:3000;
  }

  location /apk/ {
    autoindex off;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "private, max-age=0, no-store" always;
    rewrite ^/apk/(.*)$ /$1 break;
    try_files "/mnt/share$uri" "/mnt/share/Apps Standard/Android/Release/apk$uri" =404;
  }
}
