services:
  secure-apk:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SECURE_APK_PORT:-5057}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pm_share_ro:/mnt/share:ro

  uploader:
    build:
      context: ./uploader
    restart: unless-stopped
    environment:
      - PORT=3000
      - SHARE_DIR=/mnt/share
      - SECURE_APK_UPLOAD_TOKEN=${SECURE_APK_UPLOAD_TOKEN}
      - SECURE_APK_ALLOWED_PREFIXES=${SECURE_APK_ALLOWED_PREFIXES:-pm-tech_v}
      - SECURE_APK_UPLOAD_MAX_BYTES=${SECURE_APK_UPLOAD_MAX_BYTES:-419430400}
    volumes:
      - pm_share_rw:/mnt/share

volumes:
  pm_share_ro:
    driver: local
    driver_opts:
      type: cifs
      o: username=${DOMAIN_USERNAME},domain=${CIFS_DOMAIN:-mbma},password=${DOMAIN_PASSWORD},sec=${CIFS_SEC:-ntlmssp},vers=${CIFS_VERS:-3.0},uid=${CIFS_UID:-1000},gid=${CIFS_GID:-1000},file_mode=${CIFS_FILE_MODE:-0555},dir_mode=${CIFS_DIR_MODE:-0555},noperm,ro,prefixpath=${CIFS_PREFIX_PATH:-}
      device: "${CIFS_SHARE_PATH}"

  pm_share_rw:
    driver: local
    driver_opts:
      type: cifs
      o: username=${DOMAIN_USERNAME},domain=${CIFS_DOMAIN:-mbma},password=${DOMAIN_PASSWORD},sec=${CIFS_SEC:-ntlmssp},vers=${CIFS_VERS:-3.0},uid=${CIFS_UID:-1000},gid=${CIFS_GID:-1000},file_mode=${CIFS_RW_FILE_MODE:-0664},dir_mode=${CIFS_RW_DIR_MODE:-0775},noperm,prefixpath=${CIFS_PREFIX_PATH:-}
      device: "${CIFS_SHARE_PATH}"
